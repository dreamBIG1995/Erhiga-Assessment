 <!--CONTACT SECTION -->
 <!DOCTYPE html>
<html lang="en">
<head>
    <link rel=""stylesheet"
    type=""text/css
    href=""css/main.css">
    <h2 id="contact">Contact Us</h2>

    <!-- Your Map Image on the Right -->
    <img src="Map.png" align="right" width="300" alt="Map showing directions to Sunny Farm">

    <p>Email: info@sunnyfarm.co.uk</p>
    <p>Phone: 01234 567890</p>

    <h3>Find Us</h3>
    <p>We are located near Aberdeen. See the map for directions.</p>

    <h3>Send Us a Message</h3>

    <form>
        <label>Your Name:</label><br>
        <input type="text" name="name"><br><br>

        <label>Your Email:</label><br>
        <input type="email" name="email"><br><br>

        <label>Your Message:</label><br>
        <textarea name="message" rows="5" cols="30"></textarea><br><br>

        <input type="submit" value="Send Message">
    </form>

    <!-- Footer -->
    <hr>
    

</body>
</html>
