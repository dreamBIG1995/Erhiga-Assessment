<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wanderlust</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --cream: #f5f0e8;
      --ink: #1a1612;
      --rust: #b85c38;
      --sand: #d4c5a9;
    }

    body {
      background: var(--cream);
      color: var(--ink);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      padding: 2rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 0.75rem;
      margin-bottom: 3rem;
      animation: fadeDown 0.6s ease both;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      letter-spacing: 0.05em;
    }

    header span {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--rust);
    }

    .grid {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      grid-template-rows: auto auto;
      gap: 1.5rem;
      max-width: 960px;
      margin: 0 auto;
    }

    .card {
      overflow: hidden;
      position: relative;
      cursor: pointer;
      animation: fadeUp 0.7s ease both;
    }

    .card:nth-child(2) { animation-delay: 0.1s; }
    .card:nth-child(3) { animation-delay: 0.2s; grid-column: 1; }
    .card:nth-child(4) { animation-delay: 0.3s; grid-column: 2; grid-row: 2; }

    .card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
      filter: sepia(15%) contrast(1.05);
      transition: transform 0.6s ease, filter 0.4s ease;
    }

    .card:hover img {
      transform: scale(1.04);
      filter: sepia(0%) contrast(1.1);
    }

    .card-label {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 1.5rem 1rem 1rem;
      background: linear-gradient(to top, rgba(26,22,18,0.75) 0%, transparent 100%);
      color: var(--cream);
    }

    .card-label .tag {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--rust);
      display: block;
      margin-bottom: 0.3rem;
    }

    .card-label h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 400;
      line-height: 1.3;
    }

    .card-label p {
      font-size: 0.8rem;
      opacity: 0.75;
      margin-top: 0.3rem;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <h1>Wanderlust</h1>
    <span>Travel &amp; Culture — Spring 2026</span>
  </header>

  <div class="grid">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&q=80" alt="Mountain landscape">
      <div class="card-label">
        <span class="tag">Alps</span>
        <h2>The Last Light of the Bernese Highlands</h2>
        <p>Switzerland · 6 min read</p>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?w=600&q=80" alt="Desert dunes">
      <div class="card-label">
        <span class="tag">Sahara</span>
        <h2>Dunes at Dawn</h2>
        <p>Morocco · 4 min read</p>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1528360983277-13d401cdc186?w=700&q=80" alt="Japanese street">
      <div class="card-label">
        <span class="tag">Japan</span>
        <h2>Narrow Lanes, Endless Wonder</h2>
        <p>Kyoto · 5 min read</p>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1518509562904-e7ef99cdcc86?w=600&q=80" alt="Ocean coast">
      <div class="card-label">
        <span class="tag">Azores</span>
        <h2>Where the Atlantic Rests</h2>
        <p>Portugal · 3 min read</p>
      </div>
    </div>

  </div>

</body>
</html>
